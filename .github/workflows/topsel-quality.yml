name: TOPSEL artifact quality
on:
  push:
    paths:
      - 'topsel-school/**'
      - '.github/scripts/verify-topsel.py'
      - '.github/workflows/topsel-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate published artifact, SEO, assets and approved OG
        run: python3 .github/scripts/verify-topsel.py topsel-school
