<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d98a"/>
      <stop offset="0.5" stop-color="#d4a857"/>
      <stop offset="1" stop-color="#8a5f1a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141a"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff5cc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="10" y="17" width="44" height="30" rx="5"/></clipPath>
  </defs>
  <!-- тёмный корпус -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(212,168,87,0.35)" stroke-width="1.4"/>
  <!-- тёплое сияние -->
  <ellipse cx="32" cy="32" rx="24" ry="18" fill="rgba(212,168,87,0.16)"/>
  <!-- золотая карта NFT -->
  <rect x="10" y="17" width="44" height="30" rx="5" fill="url(#g)"/>
  <rect x="11" y="18" width="42" height="28" rx="4" fill="none" stroke="rgba(60,38,8,0.55)" stroke-width="1"/>
  <!-- чип -->
  <rect x="15" y="24" width="9" height="7" rx="1.5" fill="#171006" opacity="0.85"/>
  <rect x="16.2" y="25.2" width="6.6" height="4.6" rx="1" fill="none" stroke="rgba(245,217,138,0.8)" stroke-width="0.7"/>
  <!-- строки-данные -->
  <rect x="15" y="37" width="20" height="2.6" rx="1.3" fill="#171006" opacity="0.7"/>
  <rect x="15" y="41.5" width="12" height="2.6" rx="1.3" fill="#171006" opacity="0.5"/>
  <!-- глобус -->
  <g stroke="#171006" stroke-width="1" fill="none" opacity="0.8">
    <circle cx="45" cy="38" r="5.2"/>
    <ellipse cx="45" cy="38" rx="5.2" ry="2.1"/>
    <ellipse cx="45" cy="38" rx="2.1" ry="5.2"/>
  </g>
  <!-- блик -->
  <g clip-path="url(#card)">
    <rect x="20" y="10" width="9" height="46" transform="skewX(-18)" fill="url(#sh)"/>
  </g>
</svg>
