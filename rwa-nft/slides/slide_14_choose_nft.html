<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14. Выберите свой NFT</title>
<script src="../shared/i18n.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/voice/voice-gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;
  --ink:#f5f5f7; --ink-2:rgba(245,245,247,0.85); --ink-3:rgba(245,245,247,0.5);
  --line:rgba(245,245,247,0.08);
  --gold:#d4a857; --gold-2:#f0c674; --gold-3:#b8862e;
  --plat:#b8bbbf; --plat-2:#e8eaec;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  height:100vh;width:100vw;-webkit-font-smoothing:antialiased;user-select:none}
.step-indicator,.nav-hint,.reset-btn,.slide-num,.slide-tag{display:none!important}



.slide{width:100vw;height:100vh;position:relative;overflow:hidden;cursor:pointer;
  background:
    radial-gradient(ellipse 70% 50% at 50% 30%, rgba(212,168,87,0.07) 0%, transparent 60%),
    radial-gradient(ellipse at center, #0c0b12 0%, #050508 100%)}
/* фоновые слои тиров: тьма теплеет от платины к золоту */
.bgtier{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 1.4s var(--ease)}
.bg-prem{background:
  radial-gradient(ellipse 80% 60% at 50% 30%, rgba(212,168,87,0.12) 0%, transparent 62%),
  radial-gradient(ellipse at center, #120e07 0%, #070503 100%)}
.bg-elite{background:
  radial-gradient(ellipse 70% 55% at 50% 28%, rgba(240,198,116,0.2) 0%, transparent 60%),
  radial-gradient(ellipse 100% 45% at 50% 108%, rgba(212,168,87,0.14) 0%, transparent 60%),
  radial-gradient(ellipse at center, #191106 0%, #0a0703 100%)}
.slide.tier-premium .bg-prem{opacity:1}
.slide.tier-elite .bg-elite{opacity:1}
.slide.tier-elite .gridfloor{background-image:
  linear-gradient(rgba(240,198,116,0.1) 1px, transparent 1px),
  linear-gradient(90deg, rgba(240,198,116,0.1) 1px, transparent 1px)}

.gridfloor{position:absolute;left:-20%;right:-20%;bottom:-14%;height:38%;pointer-events:none;z-index:1;
  background-image:
    linear-gradient(rgba(212,168,87,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,168,87,0.06) 1px, transparent 1px);
  background-size:56px 34px;
  transform:perspective(600px) rotateX(58deg);
  -webkit-mask-image:radial-gradient(ellipse 70% 90% at 50% 100%, #000 30%, transparent 78%);
  mask-image:radial-gradient(ellipse 70% 90% at 50% 100%, #000 30%, transparent 78%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0.04;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease);
  pointer-events:none} /* скрытый слой не перехватывает клики */
.reveal.shown{opacity:1;transform:translateY(0);pointer-events:auto}

/* ===== Заголовок ===== */
.head{position:absolute;top:5vh;left:0;right:0;text-align:center;z-index:10;pointer-events:none}
.head .eyebrow{font-family:var(--display);font-weight:500;font-size:clamp(11px,0.95vw,14px);
  letter-spacing:0.35em;text-transform:uppercase;color:var(--gold-2);
  text-shadow:0 0 24px rgba(212,168,87,0.5)}
.head h1{margin-top:1.6vh;font-family:var(--display);font-weight:200;
  font-size:clamp(28px,3.2vw,52px);letter-spacing:-0.02em;color:var(--ink);
  text-shadow:0 2px 20px rgba(0,0,0,0.8)}
.head h1 em{font-style:normal;font-weight:400;color:var(--gold-2);
  text-shadow:0 0 40px rgba(212,168,87,0.5)}
.head .sub{margin-top:1.2vh;font-family:var(--body);font-weight:500;
  font-size:clamp(13px,1.15vw,18px);color:var(--ink-3)}

/* ===== Карусель ===== */
.rail{position:absolute;top:50%;left:50%;width:0;height:0;z-index:5}
.stage{position:absolute;left:0;right:0;top:15vh;bottom:29vh;z-index:5;touch-action:pan-y;cursor:grab}
.stage.dragging{cursor:grabbing}

.ncard{position:absolute;left:0;top:0;
  width:clamp(190px,18vw,306px);height:clamp(252px,23.8vw,405px);
  margin-left:calc(clamp(190px,18vw,306px) / -2);
  margin-top:calc(clamp(252px,23.8vw,405px) / -2);
  transform:translateX(0);
  border-radius:18px;overflow:visible; /* искры и лента выходят за карту */
  background:#07070a; /* сплошной чёрный: видео растворяется без границ */
  border:1px solid rgba(184,187,191,0.35);
  box-shadow:0 24px 70px rgba(0,0,0,0.7);
  will-change:transform,opacity;
  pointer-events:none}
.ncard.gold{border-color:rgba(212,168,87,0.55)}
.ncard.center{box-shadow:0 30px 90px rgba(0,0,0,0.8), 0 0 60px rgba(184,187,191,0.12)}
.ncard.gold.center{box-shadow:0 30px 90px rgba(0,0,0,0.8), 0 0 70px rgba(212,168,87,0.28)}
.ncard.elite.center{border-color:rgba(240,198,116,0.85);
  box-shadow:0 30px 90px rgba(0,0,0,0.8), 0 0 90px rgba(212,168,87,0.45)}

/* 3D-переворот карты: лицо с видео <-> оборот с параметрами */
.flipbox{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .8s var(--ease)}
.ncard.flipped .flipbox{transform:rotateY(180deg)}
.ncard.flipped .tierintro{opacity:0;transition:opacity .3s}
/* внутренний слой: всё содержимое карты обрезается тут */
.cbody{position:absolute;inset:0;border-radius:18px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* оборот: паспорт NFT */
.cback{position:absolute;inset:0;border-radius:18px;overflow:hidden;
  transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:
    radial-gradient(ellipse 90% 40% at 50% 0%, rgba(212,168,87,0.07) 0%, transparent 60%),
    #0a0a0d;
  display:flex;flex-direction:column;
  padding:clamp(12px,1.4vw,22px) clamp(14px,1.5vw,24px)}
.cb-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:0.7em;margin-bottom:0.4em;
  border-bottom:1px solid rgba(245,245,247,0.14)}
.cb-name{font-family:var(--display);font-weight:500;
  font-size:clamp(13px,1.2vw,19px);letter-spacing:0.04em;color:var(--tc)}
.cb-price{font-family:var(--display);font-weight:300;
  font-size:clamp(10px,0.9vw,14px);color:var(--ink-2)}
.cb-rows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.cb-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cb-row .l{font-family:var(--body);font-weight:500;
  font-size:clamp(10px,0.85vw,13px);color:var(--ink-3);text-align:left}
.cb-row .v{font-family:var(--body);font-weight:600;
  font-size:clamp(10px,0.88vw,13px);color:var(--ink-2);white-space:nowrap}
.cb-row .v.yes{color:var(--tc)}
.cb-row .v.no{color:rgba(245,245,247,0.25)}
.cb-hint{margin-top:0.5em;text-align:center;
  font-family:var(--display);font-weight:300;
  font-size:clamp(7px,0.6vw,9px);letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(245,245,247,0.3)}
.ncard video{position:absolute;top:9%;left:0;width:100%;height:55%;object-fit:cover;
  transform:scale(1.14);transform-origin:center;
  /* виньетка со всех сторон: видео растворяется в чёрном теле карты */
  -webkit-mask-image:radial-gradient(ellipse 74% 72% at 50% 50%, #000 42%, transparent 92%);
  mask-image:radial-gradient(ellipse 74% 72% at 50% 50%, #000 42%, transparent 92%)}
.ncard .vfade{position:absolute;top:5%;left:0;width:100%;height:63%;
  background:linear-gradient(180deg,
    rgba(10,10,14,1) 0%, rgba(10,10,14,0) 26%,
    rgba(10,10,14,0) 58%, rgba(10,10,14,0.97) 100%)}

.ncard .info{position:absolute;left:0;right:0;bottom:0;height:40%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(3px,0.5vh,8px);padding:0 14px;text-align:center}
.ncard .nname{font-family:var(--display);font-weight:500;
  font-size:clamp(17px,1.7vw,28px);letter-spacing:0.04em;
  background:linear-gradient(105deg,#ffffff 0%,var(--plat-2) 40%,var(--plat) 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ncard.gold .nname{background:linear-gradient(105deg,#fff0c4 0%,var(--gold-2) 45%,var(--gold) 80%);
  -webkit-background-clip:text;background-clip:text}
.ncard .nprice{font-family:var(--display);font-weight:400;
  font-size:clamp(13px,1.25vw,20px);color:var(--ink)}
.ncard .nrow{display:flex;gap:clamp(10px,1.2vw,22px)}
.ncard .nmeta{font-family:var(--body);font-weight:600;font-size:clamp(10px,0.85vw,13px);color:var(--ink-3)}
.ncard .nmeta b{color:var(--ink-2);font-weight:600}
.ncard .nlim{font-family:var(--display);font-weight:300;font-size:clamp(9px,0.78vw,12px);
  letter-spacing:0.12em;text-transform:uppercase;color:var(--plat)}
.ncard.gold .nlim{color:var(--gold-2)}
/* бейдж тира */
/* === Тир-плашка как титр в новостном эфире: выезжает у центральной карты === */
/* === Тихий люкс: волосок -> стеклянная плашка -> печать текста === */
.ncard{--tc:#d3d6db;--tc-glow:rgba(200,203,208,0.35)}
.ncard.gold{--tc:var(--gold-2);--tc-glow:rgba(212,168,87,0.4)}
.ncard.elite{--tc:#ffb050;--tc-glow:rgba(255,150,60,0.5)}

.tierintro{position:absolute;top:5.5%;left:16px;right:16px;z-index:7;pointer-events:none}
/* золотой волосок с растворяющимся хвостом */
.ti-line{display:block;height:2px;width:0;border-radius:1px;
  background:linear-gradient(90deg, var(--tc) 0%, var(--tc) 45%, transparent 100%);
  box-shadow:0 0 10px var(--tc-glow);
  transition:width .5s var(--ease)}
.ncard.center .ti-line{width:62%}
/* стеклянная плашка: почти невидимая, разворачивается из линии */
.ti-plate{display:inline-flex;align-items:center;gap:0.7em;
  margin-top:6px;padding:0.45em 1.1em 0.45em 0.8em;
  background:linear-gradient(90deg, rgba(14,14,18,0.66) 0%, rgba(14,14,18,0.28) 78%, transparent 100%);
  backdrop-filter:blur(8px);border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.07);
  clip-path:inset(0 100% 0 0);
  transition:clip-path .55s var(--ease) .3s}
.ncard.center .ti-plate{clip-path:inset(0 0 0 0)}
/* ромб-самоцвет */
.ti-dot{width:6px;height:6px;flex:none;transform:rotate(45deg);
  background:var(--tc);box-shadow:0 0 8px var(--tc-glow)}
.ncard.elite .ti-dot{animation:tiEmber 2s ease-in-out infinite}
@keyframes tiEmber{
  0%,100%{box-shadow:0 0 6px rgba(255,150,60,0.5)}
  50%{box-shadow:0 0 14px rgba(255,120,40,0.95)}
}
/* печатаемый текст */
.ti-text{font-family:var(--display);font-weight:300;
  font-size:clamp(11px,0.95vw,14px);letter-spacing:0.32em;text-transform:uppercase;
  color:var(--tc);text-shadow:0 0 14px var(--tc-glow);
  min-height:1em;min-width:2px}

/* лента-уголок как на подарочной упаковке (пока не используется) */
.tierbadge{position:absolute;top:26px;left:-64px;width:215px;z-index:7;
  transform:rotate(-45deg);text-align:center;padding:0.85em 0;
  font-family:var(--display);font-weight:500;
  font-size:clamp(12px,1.05vw,15px);letter-spacing:0.24em;text-transform:uppercase;
  text-indent:0.24em; /* компенсация трекинга: текст строго по центру */
  color:#14141a;
  background:linear-gradient(180deg,#f4f6f8 0%,#c6c9cd 45%,#8e9196 100%);
  box-shadow:0 4px 14px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.75), inset 0 -1px 0 rgba(0,0,0,0.35),
    inset 0 4px 0 -2px rgba(255,255,255,0.35), inset 0 -4px 0 -2px rgba(0,0,0,0.2)}
.ncard.gold .tierbadge{color:#1c1206;
  background:linear-gradient(180deg,#ffe9a8 0%,#d9ad5a 45%,#a87a26 100%);
  box-shadow:0 4px 14px rgba(0,0,0,0.6), 0 0 20px rgba(212,168,87,0.35),
    inset 0 1px 0 rgba(255,245,210,0.85), inset 0 -1px 0 rgba(80,52,10,0.5),
    inset 0 4px 0 -2px rgba(255,245,210,0.4), inset 0 -4px 0 -2px rgba(80,52,10,0.25)}
/* ELITE горит лавой: огненный градиент как на карте FLAME */
.ncard.elite .tierbadge{color:#2a0b02;
  background:linear-gradient(180deg,#ffdf9a 0%,#ff9a3c 45%,#ef531e 100%);
  box-shadow:0 4px 14px rgba(0,0,0,0.6), 0 0 24px rgba(255,140,60,0.5),
    inset 0 1px 0 rgba(255,235,190,0.9), inset 0 -1px 0 rgba(120,30,6,0.55),
    inset 0 4px 0 -2px rgba(255,235,190,0.45), inset 0 -4px 0 -2px rgba(120,30,6,0.3);
  animation:badgeFlame 2.4s ease-in-out infinite}
@keyframes badgeFlame{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.18) drop-shadow(0 0 14px rgba(255,130,50,0.7))}
}
/* искры-угольки над надписью ELITE */
.embers{position:absolute;top:-40px;left:6px;width:84px;height:62px;
  pointer-events:none;z-index:6;overflow:visible;
  transition:transform 0.25s linear} /* ветер при прокрутке */
.embers i{position:absolute;bottom:0;left:var(--x);width:var(--s);height:var(--s);
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff2c8 0%, #f0c674 45%, rgba(212,138,60,0.9) 100%);
  box-shadow:0 0 6px rgba(255,200,110,0.9);
  opacity:0;
  animation:emberUp var(--d) linear var(--dl) infinite}
@keyframes emberUp{
  0%   { transform:translate(0,0) scale(1); opacity:0; }
  12%  { opacity:1; }
  55%  { opacity:0.9; }
  100% { transform:translate(var(--dx), -50px) scale(0.25); opacity:0; }
}

/* ===== различие тиров ===== */
/* Premium и Elite: корпус остаётся чёрным, тир выражают лента, рамка и свечение */
.ncard.elite{
  border-color:rgba(240,198,116,0.8);
  box-shadow:0 24px 70px rgba(0,0,0,0.7), inset 0 0 0 2px rgba(212,168,87,0.22)}
.ncard.elite .cbody::after{content:'';position:absolute;top:9%;left:-70%;width:45%;height:55%;z-index:2;
  background:linear-gradient(115deg,transparent 25%,rgba(255,235,170,0.13) 50%,transparent 75%);
  animation:eliteSweep 4s ease-in-out infinite;pointer-events:none}
@keyframes eliteSweep{0%,55%{left:-70%}100%{left:130%}}

/* точки-позиции */
.dots{position:absolute;bottom:26vh;left:0;right:0;display:flex;justify-content:center;
  gap:8px;z-index:10;pointer-events:none}
.dots .d{width:6px;height:6px;border-radius:50%;background:rgba(245,245,247,0.18);
  transition:all .4s var(--ease)}
.dots .d.on{background:var(--gold-2);width:20px;border-radius:4px;
  box-shadow:0 0 12px rgba(212,168,87,0.5)}

/* Блок дохода снизу */
/* центр между низом центральной карты и низом экрана */
.income{position:absolute;top:calc(71.5vh + clamp(63px, 5.95vw, 101px));
  transform:translateY(-50%);left:0;right:0;text-align:center;z-index:10;pointer-events:none}
.income.reveal{transform:translateY(calc(-50% + 24px))}
.income.reveal.shown{transform:translateY(-50%)}
.income .q{font-family:var(--display);font-weight:200;
  font-size:clamp(17px,1.8vw,30px);letter-spacing:-0.01em;color:var(--ink);
  text-shadow:0 2px 16px rgba(0,0,0,0.7)}
.income .row{margin-top:2.2vh;display:flex;justify-content:center;gap:clamp(50px,8vw,150px)}
.income .pct{font-family:'Tenor Sans',serif;font-weight:400;
  font-size:clamp(30px,3.6vw,60px);letter-spacing:0.02em;color:var(--gold-2);
  text-shadow:0 0 40px rgba(212,168,87,0.45), 0 2px 12px rgba(0,0,0,0.7)}
.income .cap{margin-top:0.8vh;font-family:var(--body);font-weight:500;
  font-size:clamp(11px,0.95vw,15px);color:var(--ink-3)}
/* призыв к действию: точка-зерно -> кнопка на месте текста */
.income .q,.income .row{transition:opacity .4s var(--ease)}
.income.cta-mode .q,.income.cta-mode .row{display:none}
.income.cta-mode{top:75.5vh} /* кнопка с воздухом от карты */
.cta-row{position:relative;margin-top:2.2vh;pointer-events:auto}
.cta-copy{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);
  width:min(90vw,640px);margin:12px 0 0;padding:0;font-family:var(--body);font-weight:400;
  font-size:clamp(12px,1vw,14px);line-height:1.5;letter-spacing:0;color:var(--ink-3);
  text-align:center;pointer-events:none}
.cta-copy span{display:block}
.cta-row.open .cta-copy{display:block}
.income.cta-mode .cta-row{margin-top:0}
/* зерно: дышащая точка и еле заметные шевроны с двух сторон */
.cta-seed{display:inline-flex;align-items:center;gap:13px;cursor:pointer;padding:12px 18px}
.seed-dot{width:9px;height:9px;border-radius:50%;background:var(--gold-2);
  animation:seedBreathe 2.6s ease-in-out infinite}
@keyframes seedBreathe{
  0%,100%{opacity:.35;box-shadow:0 0 4px rgba(212,168,87,0.3)}
  50%{opacity:1;box-shadow:0 0 14px rgba(240,198,116,0.8)}
}
.cta-seed .sc{width:9px;height:9px;opacity:.3;
  border-right:1px solid var(--gold-2);border-bottom:1px solid var(--gold-2);
  animation:scPulse 2.6s ease-in-out infinite}
.cta-seed .sc.l,.cta-seed .sc.l2{transform:rotate(-45deg)}   /* указывают вправо, на точку */
.cta-seed .sc.r,.cta-seed .sc.r2{transform:rotate(135deg)}   /* указывают влево, на точку */
.cta-seed .sc.l2,.cta-seed .sc.r2{animation-delay:.3s}
@keyframes scPulse{0%,100%{opacity:.14}50%{opacity:.55}}
.cta-row.open .cta-seed{display:none}
.cta-btn{position:relative;display:none;overflow:hidden;cursor:pointer;
  padding:0.75em 2.2em;border-radius:100px;
  font-family:var(--display);font-weight:400;
  font-size:clamp(14px,1.3vw,21px);letter-spacing:0.05em;color:#1a1206;
  background:linear-gradient(180deg,#f7dd92 0%,#d9ad5a 55%,#b8862e 100%);
  box-shadow:0 8px 32px rgba(0,0,0,0.55), 0 0 44px rgba(212,168,87,0.35),
    inset 0 1px 0 rgba(255,245,210,0.85);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
.cta-btn:hover{transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,0.6), 0 0 60px rgba(212,168,87,0.55),
    inset 0 1px 0 rgba(255,245,210,0.85)}
.cta-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,0.35) 50%,transparent 70%);
  animation:ctaShine 3.6s ease-in-out infinite;pointer-events:none}
@keyframes ctaShine{0%,100%{left:-100%}55%{left:100%}}
.cta-row.open .cta-btn{display:inline-block;animation:ctaPop .55s var(--ease)}
@keyframes ctaPop{
  0%{transform:scale(0.1);opacity:0}
  70%{transform:scale(1.06);opacity:1}
  100%{transform:scale(1);opacity:1}
}


/* Short landscape screens need space for the card, button and small caption. */
@media (orientation: landscape) and (max-height: 450px) {
  .head { top: 2vh; }
  .ncard { width: 36.2vh; height: 48vh; margin-left: -18.1vh; margin-top: -24vh; }
  .stage { top: 22vh; bottom: 28vh; }
  .income.cta-mode { top: 80.5vh; }
  .cta-copy { margin-top: 10px; }
}

/* ===================== ПОРТРЕТ НА ТЕЛЕФОНЕ ===================== */
@media (orientation: portrait) and (max-width: 620px) {
  .head { top: 2.5vh; }
  .head .eyebrow { font-size: 11px; letter-spacing: 0.28em; }
  .head h1 { margin-top: 1vh; font-size: 27px; }
  .head .sub { margin-top: 0.8vh; font-size: 13px; padding: 0 22px; }

  .stage { top: 15vh; bottom: 33vh; }

  .ncard {
    width: min(62vw, 250px); height: min(82vw, 330px);
    margin-left: calc(min(62vw, 250px) / -2);
    margin-top: calc(min(82vw, 330px) / -2);
  }
  .ncard video { top: 8%; height: 54%; }
  .nname { font-size: 19px; }
  .nprice { font-size: 15px; }
  .nmeta { font-size: 11px; }
  .ti-text { font-size: 11px; letter-spacing: 0.24em; }
  .cb-name { font-size: 15px; }
  .cb-price { font-size: 12px; }
  .cb-row .l, .cb-row .v { font-size: 11px; }

  /* блок дохода: ближе к карте, компактнее */
  .income { top: auto !important; bottom: 13vh; transform: none !important; }
  .income.reveal { transform: translateY(20px) !important; }
  .income.reveal.shown { transform: translateY(0) !important; }
  .income .q { font-size: 17px; padding: 0 20px; }
  .income .row { margin-top: 1.6vh; gap: 26px; }
  .income .pct { font-size: 30px; }
  .income .cap { font-size: 11px; max-width: 140px; margin-left: auto; margin-right: auto; }
  .income.cta-mode { top: auto !important; bottom: 15vh; }

  .cta-btn { font-size: 15px; padding: 0.75em 1.7em; }
  .cta-seed { padding: 16px 20px; }


  /* соседние карточки на узком экране почти не видны — фокус на центре */
  .bgtier { transition: opacity 0.9s var(--ease); }
}

<script>
/* ===== ДАННЫЕ ===== */
const NFT=[
  {name:'GENESIS', price:28,    depth:2,  limit:75},
  {name:'ADVANCE', price:55,    depth:3,  limit:160},
  {name:'ASCEND',  price:140,   depth:4,  limit:375},
  {name:'ECLIPSE', price:275,   depth:6,  limit:650},
  {name:'HYDRO',   price:550,   depth:9,  limit:1400},
  {name:'QUANTUM', price:1100,  depth:11, limit:2700},
  {name:'PULSE',   price:2200,  depth:12, limit:5800},
  {name:'AURORA',  price:5500,  depth:13, limit:12800},
  {name:'FLAME',   price:11000, depth:15, limit:28000},
  {name:'INFINITY',price:24000, depth:22, limit:70000}
];
const fmtN=n=>Math.round(n).toLocaleString('en-US').replace(/,/g,'  ');

/* ССЫЛКА ПРИГЛАШЕНИЯ: можно заменить на свою реферальную */
const REF_LINK='https://app.rwanftfi.com/';

/* дни генерации NFTM/DA по тирам (из презентации) */
const DAYS=[null,null,null,null,45,44,43,42,41,40];
const dayWord=n=>{ if(I18N.current!=='ru') return n+' '+T(n===1?'s14.days.1':'s14.days.many');
  const d=n%10; return n+' '+(d===1?'день':(d>=2&&d<=4?'дня':'дней')); };

/* ===== ПОСТРОЕНИЕ КАРТ ===== */
const rail=document.getElementById('rail');
const dotsEl=document.getElementById('dots');
const cards=[];
function buildCards(){
NFT.forEach((n,i)=>{
  const c=document.createElement('div');
  c.className='ncard'+(i>=4?' gold':'')+(i>=8?' elite':'');
  const ok='<span class="v yes">&#10003;</span>', no='<span class="v no">&ndash;</span>';
  const row=(l,v)=>'<div class="cb-row"><span class="l">'+l+'</span>'+
    (v===true?ok:(v===false?no:'<span class="v">'+v+'</span>'))+'</div>';
  c.innerHTML=
    '<div class="flipbox">'+
    '<div class="cbody">'+
      '<video src="../videos/nft/'+String(i+1).padStart(2,'0')+'.mp4" muted loop playsinline preload="metadata"></video>'+
      '<div class="vfade"></div>'+
      '<div class="tierintro">'+
        '<i class="ti-line"></i>'+
        '<div class="ti-plate"><b class="ti-dot"></b><span class="ti-text"></span></div>'+
      '</div>'+
      '<div class="info">'+
        '<div class="nname">'+n.name+'</div>'+
        '<div class="nprice">'+fmtN(n.price)+' USDT</div>'+
        '<div class="nrow">'+
          '<span class="nmeta">'+T('s14.levels','Уровни')+' <b>1&#8211;'+n.depth+'</b></span>'+
          '<span class="nmeta">'+T('s14.limit','Лимит')+' <b>$'+fmtN(n.limit)+'</b></span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="cback">'+
      '<div class="cb-head"><span class="cb-name">'+n.name+'</span>'+
        '<span class="cb-price">'+fmtN(n.price)+' USDT</span></div>'+
      '<div class="cb-rows">'+
        row(T('s14.b.levels','Уровни маркетинга'),'1&#8211;'+n.depth+' '+T('s14.b.of','из 22'))+
        row(T('s14.b.limit','Лимит дохода'),'$'+fmtN(n.limit))+
        row(T('s14.b.fin','Финансовые инструменты'),true)+
        row(T('s14.b.match','Matching Bonus'), i>=3)+
        row(T('s14.b.credit','Кредит под залог DA'), i>=4)+
        row(T('s14.b.nftm','Генерация NFTM'), DAYS[i]?dayWord(DAYS[i]):false)+
        row(T('s14.b.da','Начисление DA'), DAYS[i]?dayWord(DAYS[i]):false)+
      '</div>'+
      '<div class="cb-hint" data-i18n="s14.b.back">Нажмите, чтобы вернуться</div>'+
    '</div>'+
    '</div>';
  /* элитные: искры-угольки над надписью ELITE */
  if(i>=8){
    const em=document.createElement('div');
    em.className='embers';
    for(let k=0;k<21;k++){
      const p=document.createElement('i');
      p.style.setProperty('--x', (4+Math.random()*54)+'px');
      p.style.setProperty('--s', (1.6+Math.random()*2.2)+'px');
      p.style.setProperty('--d', (1.8+Math.random()*2.4)+'s');
      p.style.setProperty('--dl', (Math.random()*3)+'s');
      p.style.setProperty('--dx', ((Math.random()*22-11))+'px');
      em.appendChild(p);
    }
    c.appendChild(em);
  }
  rail.appendChild(c);
  cards.push(c);
  const d=document.createElement('div');
  d.className='d'; dotsEl.appendChild(d);
});
}
let dots=[];
buildCards();
dots=[...dotsEl.children];

/* ===== ФИЗИКА КАРУСЕЛИ ===== */
let pos=0;          /* старт: GENESIS за $28 */
let targetCard=0;
let currentVisualStep=0;
const viewedCards=new Set();
let incomeAuto=false;
let vel=0;          /* скорость, карт/кадр */
let dragging=false;
let lastX=0,lastT=0;
const SNAP=0.12;

/* ===== CARD NAVIGATION ===== */
function carouselIsSettled(){
  return !dragging && Math.abs(pos-targetCard)<0.035;
}
function markViewedCard(){
  if(currentVisualStep===0 && carouselIsSettled()) viewedCards.add(targetCard);
}
function moveCard(direction){
  if(!carouselIsSettled()) return false;
  const next=Math.max(0,Math.min(NFT.length-1,targetCard+direction));
  if(next===targetCard) return false;
  targetCard=next;vel=0;
  return true;
}

function spacing(){
  const portrait = window.innerHeight > window.innerWidth && window.innerWidth <= 620;
  if (portrait) return Math.min(window.innerWidth * 0.72, 300);
  return Math.min(window.innerWidth*0.26, 420);
}

/* печать названия тира на плашке центральной карты */
let typedFor=-1, typeTimer=null;
const TIER_NAME=i=>i>=8?'ELITE':(i>=4?'PREMIUM':'BASIC');
function typeTier(idx){
  if(typedFor===idx) return;
  typedFor=idx;
  if(typeTimer) clearInterval(typeTimer);
  cards.forEach((c,k)=>{ if(k!==idx) c.querySelector('.ti-text').textContent=''; });
  const el=cards[idx].querySelector('.ti-text');
  const word=TIER_NAME(idx);
  el.textContent='';
  let n=0;
  /* ждём, пока развернётся плашка, затем печатаем */
  setTimeout(()=>{
    if(typedFor!==idx) return;
    typeTimer=setInterval(()=>{
      if(typedFor!==idx){clearInterval(typeTimer);return;}
      n++;
      el.textContent=word.slice(0,n);
      if(n>=word.length) clearInterval(typeTimer);
    },70);
  },520);
  /* аварийная страховка: если печать не прошла, показываем слово целиком */
  setTimeout(()=>{
    if(typedFor===idx && !el.textContent) el.textContent=word;
  },1600);
}

function layout(){
  const sp=spacing();
  let nearest=Math.round(pos);
  cards.forEach((c,i)=>{
    const d=i-pos;
    const ad=Math.abs(d);
    const x=d*sp;
    const sc=Math.max(0.55, 1-0.16*ad);
    /* соседи сильно приглушены + матовое стекло: фокус на центре */
    const op=Math.max(0, 1-0.48*ad) * (1 - Math.min(1,ad)*0.5);
    const blur=Math.min(9, ad*5.5);
    const ry=Math.max(-38, Math.min(38, -d*16));
    c.style.transform='translateX('+x+'px) perspective(1100px) rotateY('+ry+'deg) scale('+sc+')';
    c.style.opacity=op;
    c.style.filter = ad<0.12 ? 'none'
      : 'blur('+blur.toFixed(1)+'px) saturate(0.75) brightness(0.85)';
    c.style.zIndex=String(100-Math.round(ad*10));
    c.classList.toggle('center', i===nearest);
    if(i!==nearest) c.classList.remove('flipped'); /* уехала = закрылась */
    /* искры сносит против движения ленты */
    const em=c.querySelector('.embers');
    if(em){
      const wind=Math.max(-46,Math.min(46, vel*600));
      em.style.transform='translateX('+wind+'px) skewX('+(wind*0.5)+'deg)';
    }
    /* видео живёт только у центральной и соседних */
    const v=c.querySelector('video');
    if(ad<1.5){ if(v.paused) v.play().catch(()=>{}); }
    else if(!v.paused) v.pause();
  });
  dots.forEach((d,i)=>d.classList.toggle('on',i===nearest));
  markViewedCard();
  if(nearest>=0&&nearest<cards.length){
    /* страховка: если по какой-то причине текст тира пуст, печатаем заново */
    const tEl=cards[nearest].querySelector('.ti-text');
    if(tEl && !tEl.textContent && typedFor===nearest) typedFor=-1;
    typeTier(nearest);
  }
  /* фон теплеет вместе с тиром */
  const slideEl=document.getElementById('slide');
  slideEl.classList.toggle('tier-premium', nearest>=4 && nearest<8);
  slideEl.classList.toggle('tier-elite', nearest>=8);
  /* блок дохода вспыхивает сам, когда лента доехала до Premium */
  if(!incomeAuto && nearest>=4){
    incomeAuto=true;
    document.getElementById('rvCta').classList.add('shown');
  }
}

function clampPos(){
  if(pos<-0.4){pos=-0.4;vel=0;}
  if(pos>NFT.length-0.6){pos=NFT.length-0.6;vel=0;}
}

function tick(){
  if(!dragging){
    pos+=(targetCard-pos)*SNAP;
    if(Math.abs(targetCard-pos)<0.004) pos=targetCard;
    vel=0;
    clampPos();
  }
  layout();
  requestAnimationFrame(tick);
}

const stage=document.getElementById('stage');
let downX=0,downY=0,moved=0,downCard=0;
stage.addEventListener('pointerdown',e=>{
  if(!carouselIsSettled()) return;
  dragging=true; vel=0;
  downCard=targetCard;
  lastX=e.clientX; lastT=performance.now();
  downX=e.clientX; downY=e.clientY; moved=0;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX;
  const now=performance.now();
  const dt=Math.max(1,now-lastT);
  pos-=dx/spacing();
  pos=Math.max(downCard-1,Math.min(downCard+1,pos));
  vel=-(dx/spacing())*(16/dt); /* скорость в картах за кадр */
  moved=Math.max(moved,Math.hypot(e.clientX-downX,e.clientY-downY));
  clampPos();
  lastX=e.clientX; lastT=now;
});
function endDrag(e){
  if(!dragging)return;
  dragging=false;
  stage.classList.remove('dragging');
  const displacement=pos-downCard;
  const offset=moved>=6 && (Math.abs(displacement)>0.18 || Math.abs(vel)>0.035)
    ? Math.sign(displacement || vel) : 0;
  targetCard=Math.max(0,Math.min(NFT.length-1,downCard+offset));
  vel=0;
  /* тап (не протяжка): переворот центральной карты */
  if(e && moved<6){
    const nearest=Math.max(0,Math.min(cards.length-1,Math.round(pos)));
    const c=cards[nearest];
    const r=c.getBoundingClientRect();
    const inX=e.clientX>=r.left&&e.clientX<=r.right;
    const inY=e.clientY>=r.top&&e.clientY<=r.bottom;
    if(inX&&inY){
      if(c.classList.contains('flipped')){
        c.classList.remove('flipped');          /* оборот: клик где угодно */
      } else if(e.clientY < r.top + r.height*0.66){
        c.classList.add('flipped');             /* лицо: клик по зоне NFT */
      }
    }
  }
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',()=>endDrag(null));

/* колесо над каруселью тоже листает карты */
stage.addEventListener('wheel',e=>{
  e.preventDefault(); e.stopPropagation();
  const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(delta) document.dispatchEvent(new CustomEvent('rwa-carousel-navigate',{detail:{direction:Math.sign(delta)}}));
},{passive:false});

window.addEventListener('resize',layout);
/* пересборка карточек при смене языка */
I18N.onChange(()=>{ rail.innerHTML=''; dotsEl.innerHTML=''; cards.length=0;
  buildCards(); dots=[...dotsEl.children]; typedFor=-1; layout(); });
requestAnimationFrame(tick);

/* CTA is an ordinary final step, not a hidden seed interaction. */
document.getElementById('ctaBtn').addEventListener('click',e=>{
  e.stopPropagation();
  if(REF_LINK) window.open(REF_LINK,'_blank');
});


/* ===== ШАГИ =====
   0: заголовок и карусель сразу (GENESIS по центру), единая озвучка
   1: открывается кнопка активации NFT после просмотра всех десяти карт
   Блок дохода появляется ТОЛЬКО сам, когда лента доехала до Premium */
function applyStep(step){
  currentVisualStep=step;
  document.getElementById('rvHead').classList.toggle('shown',step>=0);
  document.getElementById('stage').classList.toggle('shown',step>=0);
  const cta = step >= 1 && viewedCards.size===NFT.length;
  document.getElementById('ctaRow').classList.toggle('open',cta);
  document.getElementById('rvCta').classList.toggle('cta-mode',cta);
  document.getElementById('rvCta').classList.toggle('shown',cta || incomeAuto);
  markViewedCard();
}

/* ===== ENGINE (inline) ===== */
(function(){
  const isInIframe=window.parent!==window;
  let currentStep=0;const totalSteps=2;
  function post(type,data){if(!isInIframe)return;try{window.parent.postMessage({source:'slide',type,...(data||{})},'*')}catch(e){}}
  function onStep(s){applyStep(s)}
  function narrationLocked(){
    try{const v=(isInIframe?window.parent:window).RwaVoice;return !!(v&&v.listeningLock&&v.listeningLock.isLocked());}catch(e){return false;}
  }
  function nextStep(){
    if(currentStep===0){
      if(!carouselIsSettled()) return;
      markViewedCard();
      if(targetCard<NFT.length-1){moveCard(1);return;}
      if(viewedCards.size!==NFT.length){targetCard=NFT.findIndex((_,i)=>!viewedCards.has(i));return;}
    }
    if(narrationLocked()) return;
    if(currentStep<totalSteps-1){currentStep++;onStep(currentStep);post('step-changed',{step:currentStep})}else{post('slide-end-forward')}
  }
  function prevStep(){
    if(currentStep===0){if(!carouselIsSettled())return;if(targetCard>0){moveCard(-1);return;}}
    if(narrationLocked()) return;
    if(currentStep>0){currentStep--;onStep(currentStep);post('step-changed',{step:currentStep})}else{post('slide-end-backward')}
  }
  document.addEventListener('rwa-carousel-navigate',e=>{if(e.detail.direction>0)nextStep();else prevStep()});
  function reset(){
    pos=0;targetCard=0;vel=0;incomeAuto=false;viewedCards.clear();
    cards.forEach(c=>c.classList.remove('flipped'));
    currentStep=0;onStep(0);
  }
  function gotoLast(){currentStep=viewedCards.size===NFT.length?totalSteps-1:0;onStep(currentStep);post('step-changed',{step:currentStep})}
  window.RwaNftCarousel={state:()=>({step:currentStep,index:targetCard,name:NFT[targetCard].name,count:NFT.length,viewedCount:viewedCards.size,completed:viewedCards.size===NFT.length,settled:carouselIsSettled()})};
  post('slide-ready',{totalSteps});
  onStep(0);
  document.addEventListener('keydown',e=>{
    if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'||e.key==='PageDown'){e.preventDefault();nextStep()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prevStep()}
    else if(e.key==='Escape'||e.key==='r'||e.key==='R'){e.preventDefault();reset()}
  });
  let acc=0,lastW=0,wTimer=null;
  document.addEventListener('wheel',e=>{
    if(e.defaultPrevented)return; /* колесо над каруселью уже обработано */
    e.preventDefault();
    const now=Date.now();if(now-lastW<600)return;
    if(Math.sign(e.deltaY)!==Math.sign(acc)&&acc!==0)acc=0;
    acc+=e.deltaY;
    if(wTimer)clearTimeout(wTimer);
    wTimer=setTimeout(()=>{acc=0},200);
    if(Math.abs(acc)>=80){if(acc>0)nextStep();else prevStep();acc=0;lastW=now}
  },{passive:false});
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-no-click]'))return;
    nextStep();
  });
  window.addEventListener('message',e=>{
    const m=e.data;if(!m||m.source!=='deck')return;
    if(m.type==='goto-first-step')reset();
    else if(m.type==='goto-last-step')gotoLast();
    else if(m.type==='next')nextStep();
    else if(m.type==='prev')prevStep();
  });
})();
</script>
