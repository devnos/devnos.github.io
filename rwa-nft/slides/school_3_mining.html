<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Машина для добычи DA</title>
<script src="../shared/i18n.js"></script>
<script src="../shared/mobile.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c; --bg-2:#0d0d12;
  --ink:#f5f5f7; --ink-2:rgba(245,245,247,.85); --ink-3:rgba(245,245,247,.5); --ink-4:rgba(245,245,247,.3);
  --line-2:rgba(245,245,247,.15); --card-line:rgba(245,245,247,.10);
  --gold:#d4a857; --gold-2:#f0c674; --gold-3:#b8862e;
  --cold:#6f9bd1; --em:#3f8f6c; --em-2:#6fd3a8; --red:#e0713f;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
  --serif:'Tenor Sans',Georgia,serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300;
  height:100%; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none;
  -webkit-tap-highlight-color:transparent}
.grain{position:fixed; inset:0; pointer-events:none; z-index:300; opacity:.04; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.rays{position:absolute; top:-5%; left:0; right:0; height:70%; pointer-events:none; z-index:0; opacity:.85;
  background:
    linear-gradient(100deg, transparent 44%, rgba(240,198,116,.035) 47%, transparent 50%),
    linear-gradient(94deg, transparent 54%, rgba(240,198,116,.042) 57%, transparent 60%),
    linear-gradient(86deg, transparent 63%, rgba(240,198,116,.036) 66%, transparent 69%);
  filter:blur(6px)}
.gridfloor{position:absolute; left:-20%; right:-20%; bottom:-14%; height:40%; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(212,168,87,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,168,87,.07) 1px, transparent 1px);
  background-size:56px 34px;
  transform:perspective(600px) rotateX(58deg);
  -webkit-mask-image:radial-gradient(ellipse 70% 90% at 50% 100%, #000 30%, transparent 78%);
  mask-image:radial-gradient(ellipse 70% 90% at 50% 100%, #000 30%, transparent 78%)}
.slide{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column;
  background:radial-gradient(ellipse 120% 90% at 50% -10%, #101014 0%, #08080c 55%, #050507 100%);
  padding:clamp(26px,4vw,60px) clamp(20px,5vw,70px) clamp(30px,4vh,50px)}
.head{flex:0 0 auto}
.eyebrow{font-family:var(--display); font-weight:500; font-size:clamp(9px,1.1vw,11px);
  letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin-bottom:clamp(8px,1.4vh,14px);
  opacity:0; transition:opacity .6s var(--ease)}
.eyebrow.on{opacity:1}
h2{font-family:var(--display); font-weight:200; letter-spacing:-.03em; line-height:1.1;
  font-size:clamp(22px,3.4vw,40px); opacity:0; transform:translateY(12px);
  transition:opacity .7s var(--ease), transform .7s var(--ease)}
h2.on{opacity:1; transform:none}
h2 em{font-style:normal; color:var(--gold-2)}
.cap{font-size:clamp(13px,1.5vw,17px); color:var(--ink-2); margin-top:10px; min-height:3.4em;
  max-width:46em; transition:opacity .4s var(--ease)}
.cap b{font-weight:600; color:var(--ink)}
.cap i{font-style:normal; color:var(--em-2)}
.cap u{text-decoration:none; color:var(--gold-2)}

.stagewrap{flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0}
svg.stage{width:100%; height:100%; max-height:100%; overflow:hidden}

.el{opacity:0; transform:translateY(14px) scale(.985); transform-box:fill-box; transform-origin:center;
    transition:opacity .55s var(--ease), transform .55s var(--ease)}
.el.on{opacity:1; transform:none}
.el.off{opacity:0; transform:translateY(-6px) scale(.995);
        transition:opacity .3s var(--ease), transform .3s var(--ease)}
.el[data-d="1"]{transition-delay:.10s} .el[data-d="2"]{transition-delay:.30s}
.el[data-d="3"]{transition-delay:.50s} .el[data-d="4"]{transition-delay:.70s}
.el[data-d="5"]{transition-delay:.90s}
.el.off[data-d]{transition-delay:0s}
.dim{opacity:.3; transition:opacity .5s var(--ease)}
.el.on.dim{opacity:.3}

.trace{stroke-dasharray:var(--len); stroke-dashoffset:var(--len); opacity:0;
  transition:stroke-dashoffset .9s var(--ease), opacity .35s var(--ease)}
.trace.on{stroke-dashoffset:0; opacity:1}

.coin{offset-rotate:0deg; opacity:0}
.coin.run{animation:fly var(--dur,1.4s) linear forwards}
@keyframes fly{0%{offset-distance:0%; opacity:0}
  14%{opacity:1}86%{opacity:1}100%{offset-distance:100%; opacity:0}}

/* ── сгорание ── */
@keyframes lick{
  0%  {transform:scaleY(.72) scaleX(1.06) skewX(4deg)}
  35% {transform:scaleY(1.14) scaleX(.9)  skewX(-5deg)}
  70% {transform:scaleY(.88)  scaleX(1.04) skewX(3deg)}
  100%{transform:scaleY(1.2)  scaleX(.88) skewX(-2deg)}
}
.lick{animation:lick var(--t,.3s) ease-in-out infinite alternate;
      transform-box:fill-box; transform-origin:bottom center}
@keyframes fireLife{
  0%  {opacity:0;  transform:translateY(5px) scale(.35)}
  14% {opacity:1;  transform:translateY(0) scale(1)}
  62% {opacity:1;  transform:translateY(-3px) scale(1.08)}
  100%{opacity:0;  transform:translateY(-18px) scale(.3)}
}
.fireLife{animation:fireLife 1.7s cubic-bezier(.3,.1,.5,1) forwards;
          transform-box:fill-box; transform-origin:bottom center}
@keyframes glowLife{
  0%{opacity:0; transform:scale(.4)}18%{opacity:.95; transform:scale(1)}
  65%{opacity:.8; transform:scale(1.15)}100%{opacity:0; transform:scale(1.5)}
}
.glowLife{animation:glowLife 1.7s ease-out forwards; transform-box:fill-box; transform-origin:center}
@keyframes ember{
  0%  {opacity:0; transform:translate(0,0) scale(1)}
  12% {opacity:1}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.12)}
}
.ember{animation:ember var(--edur,1.3s) cubic-bezier(.25,.6,.4,1) forwards;
       transform-box:fill-box; transform-origin:center}
@keyframes smoke{
  0%  {opacity:0; transform:translate(0,0) scale(.4)}
  30% {opacity:.3}
  100%{opacity:0; transform:translate(var(--sx),var(--sy)) scale(2.4)}
}
.smoke{animation:smoke 1.9s ease-out forwards; transform-box:fill-box; transform-origin:center}

.num{font-family:var(--serif); letter-spacing:-.02em}
.lbl{font-family:var(--display); letter-spacing:.14em; text-transform:uppercase}


/* телефон в альбоме: шапка ужимается, схеме отдаётся высота */
@media (max-height:520px){
  .slide{padding:12px 18px 14px}
  .eyebrow{font-size:8px; letter-spacing:.24em; margin-bottom:5px}
  h2{font-size:clamp(17px,2.6vw,24px)}
  .cap{font-size:11.5px; margin-top:5px; min-height:3.2em; max-width:62em; line-height:1.4}
}
</style>
</head>
<body>
<div class="rays"></div>
<div class="gridfloor"></div>
<div class="grain"></div>

<section class="slide">
  <div class="head">
    <div class="eyebrow" id="eyebrow">Школа · шаг 3</div>
    <h2 id="h2">Как рождается <em>токен DA</em></h2>
    <p class="cap" id="cap"></p>
  </div>

  <div class="stagewrap">
    <svg class="stage" id="stage" viewBox="0 44 1200 382" role="img" aria-label="Механика роста DA">
      <defs>
        <linearGradient id="gNode" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a1a24"/><stop offset="100%" stop-color="#101018"/>
        </linearGradient>
        <linearGradient id="gPool" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(212,168,87,.17)"/><stop offset="100%" stop-color="rgba(63,143,108,.10)"/>
        </linearGradient>
        <linearGradient id="gCard" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,.045)"/><stop offset="100%" stop-color="rgba(255,255,255,.012)"/>
        </linearGradient>
        <radialGradient id="gGlow">
          <stop offset="0%" stop-color="#ffcf7a" stop-opacity=".95"/>
          <stop offset="40%" stop-color="#f5822a" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#e04a10" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ffd98a"/><stop offset="45%" stop-color="#f79020"/><stop offset="100%" stop-color="#e2440c" stop-opacity=".15"/>
        </linearGradient>
        <linearGradient id="gCore" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ffe6a6"/><stop offset="100%" stop-color="#ffb43c" stop-opacity=".2"/>
        </linearGradient>
        <linearGradient id="gLiquid" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#2f7d5e"/><stop offset="100%" stop-color="#6fd3a8" stop-opacity=".75"/>
        </linearGradient>
        <linearGradient id="gCoinBar" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#8a6620"/><stop offset="100%" stop-color="#f0c674" stop-opacity=".85"/>
        </linearGradient>
        <radialGradient id="cGold"><stop offset="0%" stop-color="#fbe6ad"/><stop offset="62%" stop-color="#e0b45c"/><stop offset="100%" stop-color="#a5731f"/></radialGradient>
        <radialGradient id="cGreen"><stop offset="0%" stop-color="#a6efcd"/><stop offset="62%" stop-color="#5cc396"/><stop offset="100%" stop-color="#2c6c50"/></radialGradient>
        <radialGradient id="gFlash">
          <stop offset="0%" stop-color="#ffe9b0" stop-opacity="1"/>
          <stop offset="45%" stop-color="#f0912f" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#f0912f" stop-opacity="0"/>
        </radialGradient>
        <filter id="heat2" x="-120%" y="-160%" width="340%" height="420%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="2" seed="4" result="t2">
            <animate attributeName="baseFrequency" dur="1.1s" values="0.03 0.06;0.045 0.1;0.03 0.06" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="t2" scale="3" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="heat" x="-60%" y="-90%" width="220%" height="300%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.022 0.05" numOctaves="2" seed="7" result="t">
            <animate attributeName="baseFrequency" dur="1.7s" values="0.022 0.05;0.03 0.115;0.022 0.05" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--em-2)"/>
        </marker>
        <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--gold)"/>
        </marker>
      </defs>



      <g id="node" class="el"></g>
      <g id="nft" class="el"></g>
      <g id="link"></g>
      <g id="token" class="el"></g>
      <g id="note" class="el"></g>
      <g id="coins"></g>

    </svg>
  </div>
</section>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $  = id => document.getElementById(id);
const mk = (t, a, parent) => { const e = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== undefined && a[k] !== null) e.setAttribute(k, a[k]);
  if (parent) parent.appendChild(e); return e; };
const fmt = n => Math.round(n).toLocaleString('ru-RU');
function textW(el){ try { return el.getComputedTextLength(); } catch(e){ return 0; } }

/* подпись, которая сама укладывается в заданную ширину */
function fitLabel(parent, words, x, cy, maxW, fs, fill, cls, anchor){
  const attempt = (size, lines) => {
    const g = mk('g', {}, parent);
    const lh = size * 1.7;
    const y0 = cy - (lines.length-1)*lh/2 + size*0.36;
    let over = 0;
    lines.forEach((ln, i) => {
      const t = mk('text', {x, y:(y0+i*lh).toFixed(1), class:cls, 'font-size':size,
                            fill, 'text-anchor':anchor||'start'}, g);
      t.textContent = ln;
      over = Math.max(over, textW(t) - maxW);
    });
    return {g, over};
  };
  const split = n => {
    if (n === 1) return [words.join(' ')];
    const mid = Math.ceil(words.length/2);
    return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')];
  };
  for (const lines of [1, 2]){
    if (lines === 2 && words.length < 2) continue;
    for (const size of [fs, fs-0.5, fs-1, fs-1.5, fs-2]){
      const r = attempt(size, split(lines));
      if (r.over <= 0) return r.g;
      r.g.remove();
    }
  }
  return attempt(fs-2.5, split(words.length > 1 ? 2 : 1)).g;
}


const L = {
  vb:'40 92 1120 330',
  node:{x:60,  y:150, w:250, h:150},
  nft: {x:470, y:150, w:220, h:150},
  tok: {x:860, y:150, w:250, h:150},
  arr1:{d:'M 318 225 L 462 225', lx:390, ly:208, t:'обеспечение'},
  arr2:{d:'M 698 225 L 852 225', lx:775, ly:208, t:'токены DA'}
};

function card(g, box, title, big, sub, color, stroke){
  mk('rect', {x:box.x, y:box.y, width:box.w, height:box.h, rx:18,
              fill:'url(#gCard)', stroke:stroke||'var(--card-line)'}, g);
  mk('text', {x:box.x+box.w/2, y:box.y+34, 'text-anchor':'middle', class:'lbl',
              'font-size':9.5, fill:'var(--ink-3)'}, g).textContent = title;
  mk('text', {x:box.x+box.w/2, y:box.y+94, 'text-anchor':'middle', class:'num',
              'font-size':38, fill:color}, g).textContent = big;
  mk('text', {x:box.x+box.w/2, y:box.y+122, 'text-anchor':'middle',
              'font-size':12, fill:'var(--ink-3)'}, g).textContent = sub;
}

function build(){
  $('stage').setAttribute('viewBox', L.vb);
  card($('node'), L.node, 'накопитель', '465 277', 'USDT', 'var(--em-2)');
  card($('nft'),  L.nft,  'ваше устройство', 'NFT', 'добывает DA', 'var(--gold-2)',
       'rgba(212,168,87,.45)');
  card($('token'),L.tok,  'новый токен', 'DA', 'обеспечен по текущей цене', 'var(--gold-2)');

  const gl = $('link'); gl.textContent = '';
  [['arr1','var(--em-2)','arG','a1'], ['arr2','var(--gold)','arA','a2']].forEach(([k, col, mk2, id]) => {
    const a = L[k];
    mk('text', {x:a.lx, y:a.ly, 'text-anchor':'middle', class:'lbl el', 'font-size':9,
                fill:col}, gl).textContent = a.t;
    mk('path', {id, class:'trace', d:a.d, fill:'none', stroke:col, 'stroke-width':2.2,
                'marker-end':`url(#${mk2})`}, gl);
  });
  document.querySelectorAll('.trace').forEach(p => p.style.setProperty('--len', p.getTotalLength()));

  const gn = $('note'); gn.textContent = '';
  mk('text', {x:585, y:352, 'text-anchor':'middle', 'font-size':15, fill:'var(--ink-2)'}, gn)
    .textContent = 'на каждый выпущенный токен из накопителя уходит его полная стоимость';
  mk('text', {x:585, y:378, 'text-anchor':'middle', class:'lbl', 'font-size':9,
              fill:'var(--gold)'}, gn).textContent = 'необеспеченных токенов не существует';
}

const SCENE = [
 { show:['nft'],
   cap:"Теперь про добычу. Ваше NFT это машина: она работает циклами и добывает актив DA." },

 { show:['nft','node'],
   cap:"Но токен не появляется из воздуха. В момент добычи в дело вступает накопитель." },

 { show:['nft','node','token'], arrows:2,
   cap:"Происходит два действия сразу: накопитель отдаёт <i>обеспечение в USDT</i>, и ровно на эту сумму выпускаются <u>токены DA</u> по текущей цене." },

 { show:['nft','node','token','note'], arrows:2,
   cap:"Поэтому у каждого DA с первой секунды есть деньги за спиной. <b>Необеспеченных токенов в этой системе не существует.</b>" }
];
const TOTAL = SCENE.length;

const stage=$('stage'), capEl=$('cap'), h2El=$('h2'), eyeEl=$('eyebrow');
let step = 0, timers = [], ready = false;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function clearAllTimers(){ timers.forEach(clearTimeout); timers = []; }

function coin(id, dur, kind){
  const p = $(id); if (!p) return;
  const c = mk('circle', {r:6, fill: kind==='gold'?'url(#cGold)':'url(#cGreen)', class:'coin'}, $('coins'));
  c.style.offsetPath = `path('${p.getAttribute('d')}')`;
  c.style.setProperty('--dur', dur+'ms');
  requestAnimationFrame(() => c.classList.add('run'));
  setTimeout(() => c.remove(), dur+150);
}
function render(dir){
  const sc = SCENE[step], back = dir === 'back';
  clearAllTimers();
  ['node','nft','token','note'].forEach(id => {
    const on = sc.show.includes(id); const n = $(id);
    if (n){ n.classList.toggle('on', on); n.classList.toggle('off', !on); }
  });
  const on = !!sc.arrows;
  document.querySelectorAll('#link .el, #link .trace').forEach(e => {
    e.classList.toggle('on', on); e.classList.toggle('off', !on);
  });
  if (on && !back) [0,450,900].forEach(t =>
    later(() => { coin('a1', 1100); coin('a2', 1100, 'gold'); }, 400+t));
  capEl.style.opacity = 0;
  later(() => { capEl.innerHTML = sc.cap; capEl.style.opacity = 1; }, 170);
}
/* ══════════ движок слайдов, общий для всей презентации ══════════ */
window.SlideEngine = (function(){
  let state = { currentStep:0, totalSteps:1, onStep:null, slideNumber:1, slideTotal:16,
                isInIframe: window.parent !== window };
  let wheelAccumulator = 0, wheelTimer = null, lastWheelTime = 0;
  const WHEEL_THRESHOLD = 80, WHEEL_COOLDOWN = 600;

  function postToParent(type, data){
    if (!state.isInIframe) return;
    try { window.parent.postMessage({ source:'slide', type: type, ...data }, '*'); } catch(e){}
  }
  function nextStep(){
    if (state.currentStep < state.totalSteps - 1){
      state.currentStep++; state.onStep(state.currentStep);
      postToParent('step-changed', { step: state.currentStep });
    } else postToParent('slide-end-forward', {});
  }
  function prevStep(){
    if (state.currentStep > 0){
      state.currentStep--; state.onStep(state.currentStep);
      postToParent('step-changed', { step: state.currentStep });
    } else postToParent('slide-end-backward', {});
  }
  function reset(){ state.currentStep = 0; state.onStep(0); postToParent('step-changed', { step:0 }); }
  function goToLastStep(){
    state.currentStep = state.totalSteps - 1; state.onStep(state.currentStep);
    postToParent('step-changed', { step: state.currentStep });
  }
  function init(opts){
    state.totalSteps = opts.totalSteps || 1;
    state.onStep = opts.onStep || function(){};
    state.slideNumber = opts.slideNumber || 1;
    state.slideTotal = opts.slideTotal || 16;
    state.currentStep = 0;
    state.onStep(0);
    postToParent('slide-ready', { slideNumber: state.slideNumber, totalSteps: state.totalSteps });

    document.addEventListener('keydown', function(e){
      const k = e.key, c = e.code;
      if (k === ' ' || k === 'ArrowRight' || k === 'Enter' || k === 'PageDown' ||
          c === 'Space' || c === 'ArrowRight' || c === 'Enter' || c === 'PageDown'){
        e.preventDefault(); nextStep();
      } else if (k === 'ArrowLeft' || k === 'PageUp' || c === 'ArrowLeft' || c === 'PageUp'){
        e.preventDefault(); prevStep();
      } else if (k === 'Escape' || k === 'r' || k === 'R'){
        e.preventDefault(); reset();
      }
    });

    document.addEventListener('wheel', function(e){
      e.preventDefault();
      const now = Date.now();
      if (now - lastWheelTime < WHEEL_COOLDOWN) return;
      if (Math.sign(e.deltaY) !== Math.sign(wheelAccumulator) && wheelAccumulator !== 0) wheelAccumulator = 0;
      wheelAccumulator += e.deltaY;
      if (wheelTimer) clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function(){ wheelAccumulator = 0; }, 200);
      if (Math.abs(wheelAccumulator) >= WHEEL_THRESHOLD){
        if (wheelAccumulator > 0) nextStep(); else prevStep();
        wheelAccumulator = 0; lastWheelTime = now;
      }
    }, { passive:false });

    document.addEventListener('click', function(e){
      if (e.target.closest('.reset-btn')) return;
      if (e.target.closest('[data-no-click]')) return;
      nextStep();
    });

    window.addEventListener('message', function(e){
      const msg = e.data;
      if (!msg || msg.source !== 'deck') return;
      if (msg.type === 'goto-first-step') reset();
      else if (msg.type === 'goto-last-step') goToLastStep();
      else if (msg.type === 'next') nextStep();
      else if (msg.type === 'prev') prevStep();
    });
  }
  return { init: init, nextStep: nextStep, prevStep: prevStep, reset: reset,
           getCurrentStep: function(){ return state.currentStep; },
           getTotalSteps: function(){ return state.totalSteps; } };
})();

/* ══════════ старт ══════════ */
setTimeout(() => { eyeEl.classList.add('on'); h2El.classList.add('on'); }, 120);
let prevStepNo = 0;
function boot(){
  build(); ready = true;
  setTimeout(() => {
    SlideEngine.init({
      totalSteps: TOTAL, slideNumber: 3, slideTotal: 5,
      onStep: function(n){
        const dir = n < prevStepNo ? 'back' : 'fwd';
        prevStepNo = n; step = n; render(dir);
      }
    });
  }, 700);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else setTimeout(boot, 400);
</script>
