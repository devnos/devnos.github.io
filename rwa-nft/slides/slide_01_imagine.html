<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 — Представьте</title>
<script src="../shared/i18n.js"></script>
<script src="../shared/mobile.js"></script>
<script src="../shared/voice/voice-gate.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">

<style>
/* === COMMON CSS (inline для работы из file://) === */
/* ========================================================================
   RWA NFT PRESENTATION — COMMON STYLES
   Эталонная дизайн-система. Подключается во все слайды через <link>.
   ======================================================================== */

/* === CSS-переменные === */
:root {
  /* Фоны */
  --bg: #08080c;
  --bg-2: #0d0d12;

  /* Текст */
  --ink: #f5f5f7;
  --ink-2: rgba(245, 245, 247, 0.85);
  --ink-3: rgba(245, 245, 247, 0.5);
  --ink-4: rgba(245, 245, 247, 0.18);

  /* Линии */
  --line: rgba(245, 245, 247, 0.08);

  /* Акценты — золото */
  --gold: #d4a857;
  --gold-2: #f0c674;
  --gold-3: #b8862e;
  --gold-glow: rgba(212, 168, 87, 0.4);

  /* Состояния */
  --danger: #ff5a5a;
  --green: #4ade80;

  /* Шрифты */
  --display: 'Unbounded', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, sans-serif;

  /* Главный easing */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* === Reset === */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ===================================================================
   ОБЩИЕ КОМПОНЕНТЫ
   =================================================================== */

/* === Номера слайда и тег (углы) === */
.slide-num {
  position: absolute;
  top: 32px;
  left: 32px;
  font-family: var(--display);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: rgba(255, 255, 255, 0.7);
  z-index: 30;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.slide-tag {
  position: absolute;
  top: 32px;
  right: 32px;
  font-family: var(--display);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: rgba(255, 255, 255, 0.7);
  z-index: 30;
  text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

/* === Eyebrow (золотая надпись над заголовком) === */
.eyebrow {
  font-family: var(--display);
  font-size: clamp(11px, 0.9vw, 13px);
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold-2);
  text-shadow: 0 2px 12px rgba(0,0,0,0.7);
}

/* === Headline (главный заголовок) === */
.headline {
  font-family: var(--display);
  font-weight: 200;
  font-size: clamp(36px, 4vw, 64px);
  line-height: 1.0;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.headline em {
  font-style: normal;
  color: var(--gold-2);
  font-weight: 400;
  text-shadow: 0 0 40px var(--gold-glow);
}

/* === Subtitle (под заголовком) === */
.subtitle {
  font-family: var(--body);
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.5;
  color: var(--ink-2);
}

/* === Финальный месседж (крупно, после раскрытия идеи) === */
.final-message {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(22px, 2.4vw, 38px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.final-message em {
  font-style: normal;
  color: var(--gold-2);
  font-weight: 500;
  text-shadow: 0 0 50px var(--gold-glow);
}

/* === Мега-цифра (для крупных числовых акцентов) === */
.mega-number {
  font-family: var(--display);
  font-weight: 200;
  font-size: clamp(120px, 18vw, 280px);
  line-height: 1;
  letter-spacing: -0.05em;
  color: var(--gold);
  text-shadow: 0 0 80px var(--gold-glow);
}

/* === Плашка цены (price-pill) === */
.price-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  background: linear-gradient(180deg, rgba(212,168,87,0.22), rgba(212,168,87,0.08));
  border: 1px solid rgba(240,198,116,0.55);
  border-radius: 100px;
  backdrop-filter: blur(24px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.price-pill .label {
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold-2);
}
.price-pill .amount {
  font-family: var(--display);
  font-weight: 400;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -0.01em;
}

/* === Photo-tag (метка над фото) === */
.photo-tag {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background: rgba(8, 8, 12, 0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(212, 168, 87, 0.3);
  border-radius: 100px;
}
.photo-tag .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold-2);
  box-shadow: 0 0 12px var(--gold-glow);
}
.photo-tag .name {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink);
}

/* === Усиленные тени для текста на картинке === */
.on-photo {
  text-shadow: 0 2px 24px rgba(0,0,0,0.85), 0 0 60px rgba(0,0,0,0.5);
}

/* ===================================================================
   ПЕРЕХОДЫ И РАСКРЫТИЕ ЭЛЕМЕНТОВ
   =================================================================== */

/* Стандартное появление снизу с fade */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
  pointer-events: none;
}
.reveal.shown {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Появление с лёгким масштабом (для плашек/кнопок) */
.reveal-scale {
  opacity: 0;
  transform: translateY(16px) scale(0.95);
  transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
}
.reveal-scale.shown {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Задержки появления (для каскадной анимации) */
.delay-1 { transition-delay: 0.1s; }
.delay-2 { transition-delay: 0.25s; }
.delay-3 { transition-delay: 0.4s; }
.delay-4 { transition-delay: 0.55s; }

/* ===================================================================
   НАВИГАЦИЯ ВНУТРИ СЛАЙДА
   =================================================================== */

/* Индикатор шагов */
.step-indicator {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 50;
}

.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transition: all 0.4s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.step-dot.active {
  background: var(--gold-2);
  box-shadow: 0 0 12px var(--gold-glow);
  width: 24px;
  border-radius: 4px;
}
.step-dot.completed {
  background: rgba(240, 198, 116, 0.55);
}

/* Подсказка по управлению */
.nav-hint {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.55);
  z-index: 50;
  text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

/* Кнопка сброса слайда */
.reset-btn {
  position: fixed;
  bottom: 22px;
  right: 32px;
  padding: 8px 16px;
  background: rgba(8, 8, 12, 0.55);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 50;
  backdrop-filter: blur(20px);
}
.reset-btn:hover {
  background: rgba(212, 168, 87, 0.15);
  border-color: var(--gold);
  color: var(--gold-2);
}

/* ===================================================================
   ГЛОБАЛЬНЫЕ ЭФФЕКТЫ
   =================================================================== */

/* Зернистость (накладывается поверх всего слайда) */
.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 200;
  opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* Базовый слайд-контейнер */
.slide {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* === Утилиты для картинок-фонов === */
.photo-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transform: scale(1.04);
  transition: opacity 1.4s var(--ease),
              transform 12s linear;
  z-index: 1;
}
.photo-bg.visible {
  opacity: 1;
  transform: scale(1.0);
}

/* Кинематографичный градиент для читаемости текста на фото */
.cinema-gradient {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 80% at 30% 90%, rgba(8,8,12,0.92) 0%, rgba(8,8,12,0.7) 30%, rgba(8,8,12,0) 70%),
    linear-gradient(180deg, transparent 50%, rgba(8,8,12,0.6) 100%),
    linear-gradient(180deg, rgba(8,8,12,0.35) 0%, transparent 25%);
}

/* === Глобальные правила: скрыть всю внутрислайдовую UI-навигацию === */
/* Зрители видят кино, не видят интерфейс */
.step-indicator,
.nav-hint,
.reset-btn,
.slide-num,
.slide-tag {
  display: none !important;
}

/* === Прогресс презентации (верхняя тонкая полоса) === */
/* Этот элемент управляется из родителя через postMessage */
.deck-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
  z-index: 100;
}
.deck-progress-bar {
  height: 100%;
  background: var(--gold);
  transition: width 0.6s var(--ease);
  box-shadow: 0 0 12px var(--gold-glow);
}

</style>

<style>
  /* === Слайд-специфичные стили === */

  /* Видео-фон */
  .video-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* ===== КИНО-ТИТР слева внизу (как на карточках NFT) ===== */
  .cine-plate {
    position: absolute;
    left: 60px;
    bottom: 12%;
    z-index: 6;
    padding: 1.1em 2.2em 1.1em 1.5em;
    background: linear-gradient(90deg, rgba(8,8,12,0.97) 0%, rgba(8,8,12,0.88) 85%, rgba(8,8,12,0.62) 100%);
    backdrop-filter: blur(10px);
    border-left: 3px solid var(--gold-2);
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    opacity: 0;
    transform: translateX(calc(-100% - 80px));
    transition: transform .7s var(--ease), opacity .6s var(--ease);
    pointer-events: none;
  }
  .cine-plate.in { opacity: 1; transform: translateX(0); }
  .cp-text {
    font-family: 'Tenor Sans', serif;
    font-size: clamp(20px, 2.05vw, 34px);
    line-height: 1.35;
    letter-spacing: 0.04em;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .cp-text em { font-style: normal; color: var(--gold-2);
    text-shadow: 0 2px 12px rgba(0,0,0,0.8), 0 0 30px var(--gold-glow); }

  /* ===== ВСТУПИТЕЛЬНАЯ ЗАСТАВКА (шаг 0) ===== */

  /* Общее затенение всего экрана на 50% — для вступления */
  .intro-darken {
    position: absolute;
    inset: 0;
    background: rgba(8, 8, 12, 0.7);
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    animation: introFadeIn 0.6s var(--ease) 0.2s forwards;
    transition: opacity 1s var(--ease);
  }
  .intro-darken.hidden { opacity: 0 !important; }

  @keyframes introFadeIn { to { opacity: 1; } }

  /* Вступительный текст «RWA · Начало новой реальности» */
  .intro-title {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
    text-align: center;
    padding: 0 40px;
    opacity: 0;
    transform: translateY(20px);
    animation: introTextIn 1.2s var(--ease) 0.6s forwards;
    transition: opacity 1s var(--ease), transform 1s var(--ease);
  }

  .intro-title.hidden {
    opacity: 0 !important;
    transform: translateY(-30px);
  }

  @keyframes introTextIn { to { opacity: 1; transform: translateY(0); } }

  .intro-brand {
    font-family: 'Tenor Sans', serif;
    font-weight: 400;
    font-size: clamp(64px, 8vw, 160px);
    line-height: 0.9;
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow: 0 4px 60px rgba(0,0,0,0.7), 0 0 80px rgba(212, 168, 87, 0.25);
    margin-bottom: 24px;
  }

  .intro-tagline {
    font-family: 'Tenor Sans', serif;
    font-weight: 400;
    font-size: clamp(20px, 2.2vw, 36px);
    line-height: 1.1;
    letter-spacing: 0.14em;
    color: var(--gold-2);
    text-shadow: 0 2px 24px rgba(0,0,0,0.8), 0 0 40px var(--gold-glow);
  }

  /* ===== ЛОКАЛЬНОЕ ЗАТЕНЕНИЕ ПОД ТЕКСТОМ ===== */
  .glow-spot {
    position: absolute;
    bottom: 15%;
    left: 7%;
    width: 50%;
    height: 60%;
    background: radial-gradient(ellipse at center, rgba(8,8,12,0.45) 0%, transparent 60%);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s var(--ease);
  }
  .glow-spot.intensified { opacity: 1; }

  /* ===== PHOTO TAG (правый верх) ===== */
  .photo-tag-position {
    position: absolute;
    top: 80px;
    right: 60px;
    z-index: 20;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.9s var(--ease) 0.2s,
                transform 0.9s var(--ease) 0.2s;
  }
  .photo-tag-position.shown { opacity: 1; transform: translateY(0); }

  /* ===== ТЕКСТ В НИЖНЕМ ЛЕВОМ УГЛУ ===== */
  .text-content {
    position: absolute;
    bottom: clamp(80px, 12vh, 130px);
    left: clamp(40px, 5vw, 90px);
    max-width: 720px;
    z-index: 15;
  }

  /* Стек заголовков */
  .headline-stack {
    position: relative;
    min-height: clamp(140px, 18vh, 200px);
  }

  .headline-stack .headline {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    pointer-events: none;
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 6px rgba(0,0,0,0.95),
      0 4px 20px rgba(0,0,0,0.85),
      0 0 50px rgba(0,0,0,0.6);
  }
  .headline-stack .headline em {
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 8px rgba(0,0,0,0.95),
      0 0 40px rgba(212,168,87,0.55),
      0 0 80px rgba(212,168,87,0.3);
  }
  .headline-stack .headline.shown {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Усиленные тени для текста на картинке (Zoom-friendly) */
  /* Многослойная тень: outline + размытие для максимальной читаемости */
  .text-content .on-photo {
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 4px rgba(0,0,0,0.95),
      0 4px 12px rgba(0,0,0,0.85),
      0 0 30px rgba(0,0,0,0.7),
      0 0 60px rgba(0,0,0,0.4);
  }

  /* Eyebrow — крупнее + яркий + сильная тень */
  .text-content > .eyebrow {
    font-size: clamp(13px, 1.05vw, 15px);
    color: #ffd270;
    font-weight: 600;
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    text-shadow:
      0 1px 0 rgba(0,0,0,0.95),
      0 2px 6px rgba(0,0,0,0.9),
      0 0 16px rgba(0,0,0,0.85),
      0 0 40px rgba(212,168,87,0.4);
  }
  .text-content > .eyebrow.shown { opacity: 1; transform: translateY(0); }

  /* Subtitle — белый, не приглушённый, с тенью */
  .description-line {
    max-width: 560px;
    margin: 0;
    color: #ffffff;
    font-weight: 500;
  }

  .pill-row {
    margin: 18px 0;
  }

  /* Кнопка-призыв «Один шаг» — более выраженная чем price-pill */
  .action-pill {
    position: relative;
    display: inline-block;
    padding: 14px 32px;
    background: linear-gradient(180deg, rgba(212,168,87,0.28), rgba(212,168,87,0.12));
    border: 1px solid rgba(240,198,116,0.7);
    border-radius: 100px;
    backdrop-filter: blur(24px);
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(17px, 1.5vw, 22px);
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,0.9), 0 2px 8px rgba(0,0,0,0.7);
    box-shadow: 0 6px 30px rgba(0,0,0,0.5), 0 0 40px rgba(212,168,87,0.2);
    transition: all 0.4s var(--ease);
    overflow: hidden;
  }
  .action-pill:hover {
    transform: translateY(-2px);
    background: linear-gradient(180deg, rgba(240,198,116,0.4), rgba(212,168,87,0.18));
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 60px rgba(212,168,87,0.35);
  }

  /* Золотой блик пробегает по кнопке каждые 4 секунды */
  .action-pill::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      115deg,
      transparent 30%,
      rgba(255, 255, 255, 0.15) 45%,
      rgba(255, 220, 150, 0.55) 50%,
      rgba(255, 255, 255, 0.15) 55%,
      transparent 70%
    );
    animation: pillShine 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pillShine {
    0%, 100% { left: -100%; }
    50% { left: 100%; }
  }

  .final-row {
    margin-top: 36px;
    max-width: 640px;
    font-weight: 400;
  }

  .final-row.final-message {
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 6px rgba(0,0,0,0.95),
      0 4px 16px rgba(0,0,0,0.85),
      0 0 40px rgba(0,0,0,0.5);
  }
  .final-row.final-message em {
    text-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 2px 8px rgba(0,0,0,0.95),
      0 0 30px rgba(212,168,87,0.6),
      0 0 60px rgba(212,168,87,0.4);
  }
</style>

<body>

<div class="grain"></div>

<section class="slide">
  <div class="slide-num">01 / 16</div>
  <div class="slide-tag">Представьте</div>

  <!-- Видео-фон: грузится сразу, стоит на первом кадре -->
  <video class="video-bg" id="bgVideo" src="../videos/01_resort.mp4"
         muted playsinline preload="auto"></video>

  <!-- Кино-титр (появляется после запуска видео) -->
  <div class="cine-plate" id="cinePlate">
    <span class="cp-text" id="cpText"></span>
  </div>

  <!-- ВСТУПИТЕЛЬНАЯ ЗАСТАВКА (только на шаге 0) -->
  <div class="intro-darken" id="introDarken"></div>
  <div class="intro-title" id="introTitle">
    <div class="intro-brand">RWA&nbsp;NFT</div>
    <div class="intro-tagline" data-i18n="s01.brand.sub">Начало новой реальности</div>
  </div>
</section>

<script>
/* ========================================================================
   SLIDE ENGINE — встроенная общая логика навигации
   (Inline-версия для работы даже при file:// открытии)
   ======================================================================== */
window.SlideEngine = (function() {

  let state = {
    currentStep: 0,
    totalSteps: 1,
    onStep: null,
    slideNumber: 1,
    slideTotal: 16,
    isInIframe: window.parent !== window
  };

  let wheelAccumulator = 0;
  let wheelTimer = null;
  let lastWheelTime = 0;
  const WHEEL_THRESHOLD = 80;
  const WHEEL_COOLDOWN = 600;

  function init(opts) {
    state.totalSteps = opts.totalSteps || 1;
    state.onStep = opts.onStep || (() => {});
    state.slideNumber = opts.slideNumber || 1;
    state.slideTotal = opts.slideTotal || 16;

    state.currentStep = 0;
    state.onStep(0);

    postToParent('slide-ready', {
      slideNumber: state.slideNumber,
      totalSteps: state.totalSteps
    });

    attachKeyboard();
    attachWheel();
    attachClick();
    attachMessageFromParent();
  }

  function nextStep() {
    if (state.currentStep < state.totalSteps - 1) {
      state.currentStep++;
      state.onStep(state.currentStep);
      postToParent('step-changed', { step: state.currentStep });
    } else {
      postToParent('slide-end-forward', {});
    }
  }

  function prevStep() {
    if (state.currentStep > 0) {
      state.currentStep--;
      state.onStep(state.currentStep);
      postToParent('step-changed', { step: state.currentStep });
    } else {
      postToParent('slide-end-backward', {});
    }
  }

  function reset() {
    state.currentStep = 0;
    state.onStep(0);
    postToParent('step-changed', { step: 0 });
  }

  function goToLastStep() {
    state.currentStep = state.totalSteps - 1;
    state.onStep(state.currentStep);
    postToParent('step-changed', { step: state.currentStep });
  }

  function postToParent(type, data) {
    if (!state.isInIframe) return;
    try {
      window.parent.postMessage({ source: 'slide', type, ...data }, '*');
    } catch (e) {}
  }

  function attachMessageFromParent() {
    window.addEventListener('message', (e) => {
      const msg = e.data;
      if (!msg || msg.source !== 'deck') return;
      if (msg.type === 'goto-first-step') reset();
      else if (msg.type === 'goto-last-step') goToLastStep();
      else if (msg.type === 'next') nextStep();
      else if (msg.type === 'prev') prevStep();
    });
  }

  function attachKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter' || e.key === 'PageDown') {
        e.preventDefault();
        nextStep();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevStep();
      } else if (e.key === 'Escape' || e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        reset();
      }
    });
  }

  function attachWheel() {
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastWheelTime < WHEEL_COOLDOWN) return;

      if (Math.sign(e.deltaY) !== Math.sign(wheelAccumulator) && wheelAccumulator !== 0) {
        wheelAccumulator = 0;
      }
      wheelAccumulator += e.deltaY;

      if (wheelTimer) clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAccumulator = 0; }, 200);

      if (Math.abs(wheelAccumulator) >= WHEEL_THRESHOLD) {
        if (wheelAccumulator > 0) nextStep();
        else prevStep();
        wheelAccumulator = 0;
        lastWheelTime = now;
      }
    }, { passive: false });
  }

  function attachClick() {
    document.addEventListener('click', (e) => {
      if (e.target.closest('.reset-btn')) return;
      if (e.target.closest('[data-no-click]')) return;
      nextStep();
    });
  }

  return {
    init, nextStep, prevStep, reset,
    getCurrentStep: () => state.currentStep,
    getTotalSteps: () => state.totalSteps
  };
})();
</script>

<script>
  // === Логика этого слайда ===
  // 3 шага:
  //   0: видео на первом кадре (грузится в фоне), затенение 50% + заставка "RWA NFT / Начало новой реальности"
  //   1: затенение и заставка исчезают, чистый стоп-кадр видео, без текстов
  //   2: видео запускается

  const bgVideo = document.getElementById('bgVideo');
  const introDarken = document.getElementById('introDarken');
  const introTitle = document.getElementById('introTitle');
  const cinePlate = document.getElementById('cinePlate');
  const cpText = document.getElementById('cpText');

  /* кино-титр: все таймеры в массив, отменяем при смене шага */
  let plateTimers = [];
  function clearPlate() {
    plateTimers.forEach(t => clearTimeout(t));
    plateTimers = [];
    cinePlate.classList.remove('in');
  }
  function runPlateSequence() {
    clearPlate();
    const T = (fn, ms) => plateTimers.push(setTimeout(fn, ms));
    /* +1с: первая плашка выезжает, две строки */
    T(() => {
      cpText.innerHTML = window.T('s01.plate1.l1', 'Люди отдыхают') +
        '<br><em>' + window.T('s01.plate1.l2', 'Владелец отеля получает доход') + '</em>';
      cinePlate.classList.add('in');
    }, 1000);
    /* 3.2с показа -> плашка уезжает */
    T(() => cinePlate.classList.remove('in'), 4200);
    /* +0.5с после ухода: вторая плашка с новым текстом */
    T(() => {
      cpText.innerHTML = window.I18N.current === 'ru'
        ? 'Но может быть <em>по-другому</em>'
        : '<em>' + window.T('s01.plate2') + '</em>';
      cinePlate.classList.add('in');
    }, 5400);
    /* 2.75с показа -> уезжает */
    T(() => cinePlate.classList.remove('in'), 8150);
    /* +4.5с после ухода: третья плашка */
    T(() => {
      cpText.innerHTML = window.T('s01.plate3.l1', 'Вы совладелец') +
        '<br><em>' + window.T('s01.plate3.l2', 'и получаете доход') + '</em>';
      cinePlate.classList.add('in');
    }, 13350);
    /* 4.2с показа -> уезжает насовсем */
    T(() => cinePlate.classList.remove('in'), 17550);
  }

  function renderStep(step) {
    introDarken.classList.toggle('hidden', step >= 1);
    introTitle.classList.toggle('hidden', step >= 1);

    if (step >= 2) {
      bgVideo.play().catch(() => {});
      runPlateSequence();
    } else {
      bgVideo.pause();
      clearPlate();
      if (step === 0) { try { bgVideo.currentTime = 0; } catch (e) {} }
    }
  }

  // Инициализация — 3 шага
  SlideEngine.init({
    totalSteps: 3,
    slideNumber: 1,
    slideTotal: 16,
    onStep: renderStep
  });
</script>
<div id="voiceRoot"></div>
<script src="../shared/voice/voice-autoplay.js"></script>
<script src="../shared/voice/voice-boot.js"></script>
</body>
</html>
